# Sand Table firewall for the honest version (Tier 2), on a computer you also use every day.
# It locks down only the cable to the agent box; the computer's own Wi-Fi and internet are untouched.
# Set LINK to the port wired to the agent box (often a USB Ethernet adapter):
#   networksetup -listallhardwareports
# Load and make permanent exactly as in MAC-SETUP.txt, step 7, using this file instead.
LINK = "en5"
AGENT = "10.77.0.2"
HOST  = "10.77.0.1"

# The agent box may ask the meter for model replies. Nothing else on this cable, in either direction.
pass in quick on $LINK proto tcp from $AGENT to $HOST port 8080 flags S/SA keep state
block drop quick on $LINK all
