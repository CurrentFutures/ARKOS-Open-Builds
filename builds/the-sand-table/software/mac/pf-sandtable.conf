# Sand Table firewall for the Mac Studio's link to the agent box.
# Load with: sudo pfctl -f /etc/pf.anchors/sandtable  (see MAC-SETUP.txt for making it permanent)
# Set LINK to the Mac's port wired to the agent box (find it with: networksetup -listallhardwareports)
# This blocks everything else, the Mac's own updates included. To update, follow "9. Updates" in
# MAC-SETUP.txt: unplug the agent box first, then switch this off, update, and switch it back on.
LINK = "en0"
AGENT = "10.77.0.2"
MAC   = "10.77.0.1"

set skip on lo0
block drop all
# The agent box may ask the meter for model replies. Nothing else, in either direction.
pass in quick on $LINK proto tcp from $AGENT to $MAC port 8080 flags S/SA keep state
